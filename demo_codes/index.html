<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>데모 코드 목록 | codeslog</title>
	<link rel="stylesheet" href="assets/styles/shared.css">
	<style>
		.page-header {
			padding: 32px 20px 24px;
			border-bottom: 1px solid var(--bd);
		}
		.page-title {
			font-size: 20px;
			font-weight: 700;
			margin-bottom: 6px;
		}
		.page-desc {
			font-size: 13px;
			color: var(--tx-2);
		}

		.demo-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
			gap: 12px;
		}

		.demo-card {
			display: flex;
			flex-direction: column;
			background: var(--surface);
			border: 1px solid var(--bd);
			border-radius: var(--r);
			text-decoration: none;
			transition: border-color .15s, background .15s;
			overflow: hidden;
		}
		.demo-card:hover {
			border-color: var(--accent);
			background: var(--surface-2);
		}
		.demo-card:focus {
			outline: 2px solid var(--accent);
			outline-offset: 2px;
		}

		.demo-card-body {
			padding: 16px;
			flex: 1;
		}
		.demo-tag {
			display: inline-block;
			padding: 2px 8px;
			border-radius: 3px;
			font-size: 10px;
			font-weight: 600;
			letter-spacing: .04em;
			text-transform: uppercase;
			margin-bottom: 10px;
		}
		.tag-js       { background: rgba(245,158,11,.12); color: var(--amber); border: 1px solid rgba(245,158,11,.2); }
		.tag-a11y     { background: rgba(85,88,227,.12);  color: #818cf8;      border: 1px solid rgba(85,88,227,.2); }
		.tag-ux       { background: rgba(34,197,94,.10);  color: #4ade80;      border: 1px solid rgba(34,197,94,.2); }

		.demo-name {
			font-size: 14px;
			font-weight: 600;
			color: var(--tx);
			margin-bottom: 5px;
		}
		.demo-desc {
			font-size: 12px;
			color: var(--tx-2);
			line-height: 1.5;
		}

		.demo-card-footer {
			padding: 10px 16px;
			border-top: 1px solid var(--bd);
			font-size: 11px;
			color: var(--tx-2);
		}
	</style>
</head>
