<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>02 alt·대비·lang 누락 | 에이전트 브라우징 실측</title>
	<link rel="stylesheet" href="case.css">
	<style>
		/* 케이스 02: 가격·설명을 연회색으로. 흰 배경 대비 약 2.4:1(기준 4.5:1) */
		.price, .desc { color: #a8a8a8; }
	</style>
</head>
<body>
	<a class="skip-link" href="#main">본문으로 건너뛰기</a>
	<aside class="case-note" aria-label="실험 안내" lang="ko"><strong>02 alt·대비·lang 누락.</strong> 일부러 결함을 넣은 실험 페이지입니다. 상품 사진의 대체 텍스트를 뺐고, 가격·설명 글자를 연회색(대비 약 2.4:1)으로 바꿨고, &lt;html&gt;의 lang을 지웠습니다. 버튼·링크·입력칸의 이름은 기준 페이지와 같습니다. <a href="../">실측 목록으로</a></aside>
	<header class="site-header">
		<a class="logo" href="#">머그상점</a>
		<nav aria-label="주요 메뉴">
			<ul>
				<li><a href="#">신상품</a></li>
				<li><a href="#">베스트</a></li>
				<li><a href="#">고객센터</a></li>
			</ul>
		</nav>
	</header>
	<main id="main">
		<h1>오늘의 상품</h1>
		<form class="search" role="search" onsubmit="return false">
			<div>
				<label for="q">상품 검색</label>
				<input id="q" type="search" name="q">
			</div>
			<button type="submit" class="btn btn-ghost">검색</button>
		</form>
		<article class="card">
			<img src="mug.svg" width="160" height="160">
			<div>
				<h2>하늘색 머그컵</h2>
				<p class="price">12,000원</p>
				<p class="desc">350ml · 전자레인지 사용 가능</p>
				<button type="button" class="btn" data-cart>장바구니 담기</button>
				<p class="status" role="status"></p>
			</div>
		</article>
	</main>
	<script src="case.js"></script>
</body>
</html>
