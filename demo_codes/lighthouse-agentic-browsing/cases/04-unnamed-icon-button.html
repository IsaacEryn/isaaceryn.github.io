<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>04 이름 없는 아이콘 버튼 | 에이전트 브라우징 실측</title>
	<link rel="stylesheet" href="case.css">
</head>
<body>
	<a class="skip-link" href="#main">본문으로 건너뛰기</a>
	<aside class="case-note" aria-label="실험 안내"><strong>04 이름 없는 아이콘 버튼.</strong> 일부러 결함을 넣은 실험 페이지입니다. '장바구니 담기' 글자를 카트 아이콘으로 바꾸고 이름(aria-label)을 주지 않았습니다. 진짜 &lt;button&gt;이라 키보드로 누를 수는 있지만, 접근성 트리에는 이름이 빈 버튼으로 나타나 무슨 버튼인지 알 수 없습니다. <a href="../">실측 목록으로</a></aside>
	<header class="site-header">
		<a class="logo" href="#">머그상점</a>
		<nav aria-label="주요 메뉴">
			<ul>
				<li><a href="#">신상품</a></li>
				<li><a href="#">베스트</a></li>
				<li><a href="#">고객센터</a></li>
			</ul>
		</nav>
	</header>
	<main id="main">
		<h1>오늘의 상품</h1>
		<form class="search" role="search" onsubmit="return false">
			<div>
				<label for="q">상품 검색</label>
				<input id="q" type="search" name="q">
			</div>
			<button type="submit" class="btn btn-ghost">검색</button>
		</form>
		<article class="card">
			<img src="mug.svg" width="160" height="160" alt="하늘색 머그컵. 손잡이가 오른쪽에 있고 김이 오른다">
			<div>
				<h2>하늘색 머그컵</h2>
				<p class="price">12,000원</p>
				<p class="desc">350ml · 전자레인지 사용 가능</p>
				<button type="button" class="btn" data-cart>
					<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 1.9-1.4L21 8H6.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="20" r="1.5" fill="currentColor"/><circle cx="17" cy="20" r="1.5" fill="currentColor"/></svg>
				</button>
				<p class="status" role="status"></p>
			</div>
		</article>
	</main>
	<script src="case.js"></script>
</body>
</html>
