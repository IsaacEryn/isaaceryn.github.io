<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>06 aria-label 키워드 채우기 | 에이전트 브라우징 실측</title>
	<link rel="stylesheet" href="case.css">
</head>
<body>
	<a class="skip-link" href="#main">본문으로 건너뛰기</a>
	<aside class="case-note" aria-label="실험 안내"><strong>06 aria-label 키워드 채우기.</strong> 일부러 결함을 넣은 실험 페이지입니다. '장바구니 담기' 버튼과 메뉴 링크 두 개의 aria-label에 검색 키워드를 덧붙였습니다. 화면 글자가 이름 앞부분에 그대로 있어 자동 검사는 통과하지만, 스크린 리더 사용자는 이 버튼과 링크에 닿을 때마다 덧붙인 문구까지 듣게 됩니다. <a href="../">실측 목록으로</a></aside>
	<header class="site-header">
		<a class="logo" href="#">머그상점</a>
		<nav aria-label="주요 메뉴">
			<ul>
				<li><a href="#" aria-label="신상품 2026 트렌드 인기 추천 최저가 머그컵">신상품</a></li>
				<li><a href="#" aria-label="베스트 판매 1위 인기 머그컵 선물 추천">베스트</a></li>
				<li><a href="#">고객센터</a></li>
			</ul>
		</nav>
	</header>
	<main id="main">
		<h1>오늘의 상품</h1>
		<form class="search" role="search" onsubmit="return false">
			<div>
				<label for="q">상품 검색</label>
				<input id="q" type="search" name="q">
			</div>
			<button type="submit" class="btn btn-ghost">검색</button>
		</form>
		<article class="card">
			<img src="mug.svg" width="160" height="160" alt="하늘색 머그컵. 손잡이가 오른쪽에 있고 김이 오른다">
			<div>
				<h2>하늘색 머그컵</h2>
				<p class="price">12,000원</p>
				<p class="desc">350ml · 전자레인지 사용 가능</p>
				<button type="button" class="btn" data-cart aria-label="장바구니 담기 최저가 무료배송 오늘출발 한정특가 쿠폰할인">장바구니 담기</button>
				<p class="status" role="status"></p>
			</div>
		</article>
	</main>
	<script src="case.js"></script>
</body>
</html>
