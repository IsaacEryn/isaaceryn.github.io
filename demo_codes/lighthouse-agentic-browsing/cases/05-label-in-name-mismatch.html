<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>05 보이는 글자와 다른 이름 | 에이전트 브라우징 실측</title>
	<link rel="stylesheet" href="case.css">
</head>
<body>
	<a class="skip-link" href="#main">본문으로 건너뛰기</a>
	<aside class="case-note" aria-label="실험 안내"><strong>05 보이는 글자와 다른 이름.</strong> 일부러 결함을 넣은 실험 페이지입니다. 화면에는 '장바구니 담기'라고 쓰여 있지만 aria-label은 '상품을 카트에 추가'입니다. 접근 가능한 이름은 aria-label 쪽이라, 화면 글자를 말해서 누르는 음성 제어 사용자는 이 버튼을 부르기 어렵습니다(WCAG 2.5.3이 막으려는 상황). <a href="../">실측 목록으로</a></aside>
	<header class="site-header">
		<a class="logo" href="#">머그상점</a>
		<nav aria-label="주요 메뉴">
			<ul>
				<li><a href="#">신상품</a></li>
				<li><a href="#">베스트</a></li>
				<li><a href="#">고객센터</a></li>
			</ul>
		</nav>
	</header>
	<main id="main">
		<h1>오늘의 상품</h1>
		<form class="search" role="search" onsubmit="return false">
			<div>
				<label for="q">상품 검색</label>
				<input id="q" type="search" name="q">
			</div>
			<button type="submit" class="btn btn-ghost">검색</button>
		</form>
		<article class="card">
			<img src="mug.svg" width="160" height="160" alt="하늘색 머그컵. 손잡이가 오른쪽에 있고 김이 오른다">
			<div>
				<h2>하늘색 머그컵</h2>
				<p class="price">12,000원</p>
				<p class="desc">350ml · 전자레인지 사용 가능</p>
				<button type="button" class="btn" data-cart aria-label="상품을 카트에 추가">장바구니 담기</button>
				<p class="status" role="status"></p>
			</div>
		</article>
	</main>
	<script src="case.js"></script>
</body>
</html>
