<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>패럴랙스 카드 | 실전 예제</title>
		<link rel="stylesheet" href="../styles/common.css" />
		<style>
			body {
				background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
				min-height: 100vh;
			}

			.page-header {
				padding: 80px 24px 60px;
				text-align: center;
			}

			.page-header h1 {
				font-size: clamp(32px, 6vw, 56px);
				margin-bottom: 16px;
			}

			.page-header p {
				font-size: 18px;
				color: #94a3b8;
				max-width: 500px;
				margin: 0 auto;
			}

			.back-link {
				display: inline-block;
				margin-bottom: 24px;
				font-size: 14px;
				color: #94a3b8;
			}

			/* Parallax Section */
			.parallax-section {
				min-height: 200vh;
				padding: 80px 24px;
			}

			.parallax-container {
				max-width: 1200px;
				margin: 0 auto;
				position: relative;
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 32px;
				align-items: start;
			}

			/* Cards with different speeds */
			.parallax-card {
				background: linear-gradient(145deg, #1e293b, #0f172a);
				border: 1px solid rgba(148, 163, 184, 0.1);
				border-radius: 24px;
				padding: 40px 32px;
				text-align: center;
				will-change: transform;
				position: sticky;
				top: 120px;
			}

			.parallax-card:nth-child(1) { --speed: 0.3; }
			.parallax-card:nth-child(2) { --speed: 0.5; top: 160px; }
			.parallax-card:nth-child(3) { --speed: 0.7; top: 200px; }

			.card-icon {
				width: 80px;
				height: 80px;
				margin: 0 auto 24px;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 40px;
				background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(139, 92, 246, 0.2));
				border-radius: 20px;
			}

			.parallax-card h2 {
				font-size: 24px;
				margin-bottom: 12px;
			}

			.parallax-card p {
				font-size: 15px;
				color: #94a3b8;
				line-height: 1.7;
			}

			.parallax-card .price {
				margin-top: 24px;
				font-size: 36px;
				font-weight: 700;
				background: linear-gradient(135deg, #3b82f6, #8b5cf6);
				-webkit-background-clip: text;
				-webkit-text-fill-color: transparent;
			}

			.parallax-card .btn {
				margin-top: 20px;
				width: 100%;
				justify-content: center;
			}

			/* Featured card */
			.parallax-card.featured {
				background: linear-gradient(145deg, #1e3a5f, #0f172a);
				border-color: rgba(59, 130, 246, 0.3);
				transform: scale(1.05);
			}

			.featured-badge {
				position: absolute;
				top: -12px;
				left: 50%;
				transform: translateX(-50%);
				padding: 6px 16px;
				background: linear-gradient(135deg, #3b82f6, #8b5cf6);
				border-radius: 20px;
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.03em;
				/* Dark on the gradient, not the inherited near-white: #f1f5f9 lands at
				   3.9:1 over #8b5cf6, while #0a0e17 holds 4.6:1 at the worst point. */
				color: var(--bg);
			}

			/* CTA Section */
			.cta-section {
				padding: 120px 24px;
				text-align: center;
				background: linear-gradient(180deg, transparent, rgba(59, 130, 246, 0.05));
			}

			.cta-section h2 {
				font-size: clamp(28px, 5vw, 44px);
				margin-bottom: 16px;
			}

			.cta-section p {
				font-size: 18px;
				color: #94a3b8;
				margin-bottom: 32px;
			}

			/* Footer */
			footer {
				padding: 40px 24px;
				text-align: center;
				border-top: 1px solid rgba(148, 163, 184, 0.1);
			}

			footer p {
				font-size: 14px;
				color: #94a3b8;
			}

			/* Responsive */
			@media (max-width: 900px) {
				.parallax-container {
					grid-template-columns: 1fr;
					max-width: 400px;
				}

				.parallax-card {
					position: relative;
					top: auto !important;
				}

				.parallax-card.featured {
					transform: none;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.parallax-card {
					position: relative;
					top: auto !important;
				}
			}
		</style>
	</head>
	<body>
		<a class="skip-link" href="#pricing" data-i18n="skip">요금제로 건너뛰기</a>

		<header class="page-header">
			<div class="lang-switch">
				<span class="sr-only" id="lang-label">언어 · Language</span>
				<div role="group" aria-labelledby="lang-label">
					<button type="button" class="lang-btn" data-lang="ko" aria-pressed="true" lang="ko">한국어</button>
					<button type="button" class="lang-btn" data-lang="en" aria-pressed="false" lang="en">English</button>
				</div>
			</div>
			<a href="../index.html" class="back-link" data-i18n="back">← 데모 목록으로</a>
			<h1 data-i18n="h1">요금제를 선택하세요</h1>
			<p data-i18n="lead">스크롤하면 카드가 서로 다른 속도로 움직이며 깊이감을 만듭니다.</p>
		</header>

		<main>
			<section id="pricing" class="parallax-section" aria-label="요금제" data-i18n-attr="aria-label:pricingLabel">
				<div class="parallax-container">
					<article class="parallax-card" data-parallax>
						<div class="card-icon" aria-hidden="true">🚀</div>
						<h2 data-i18n="p1H">스타터</h2>
						<p data-i18n="p1P">개인과 소규모 프로젝트에 알맞습니다.</p>
						<div class="price" data-i18n="p1Price">월 $9</div>
						<button class="btn" data-i18n="start">시작하기</button>
					</article>

					<article class="parallax-card featured" data-parallax>
						<span class="featured-badge" data-i18n="popular">가장 인기</span>
						<div class="card-icon" aria-hidden="true">⚡</div>
						<h2 data-i18n="p2H">프로</h2>
						<p data-i18n="p2P">성장하는 팀과 비즈니스에 가장 잘 맞습니다.</p>
						<div class="price" data-i18n="p2Price">월 $29</div>
						<button class="btn" data-i18n="start">시작하기</button>
					</article>

					<article class="parallax-card" data-parallax>
						<div class="card-icon" aria-hidden="true">🏢</div>
						<h2 data-i18n="p3H">엔터프라이즈</h2>
						<p data-i18n="p3P">맞춤 요구가 있는 대규모 조직을 위한 요금제입니다.</p>
						<div class="price" data-i18n="p3Price">별도 문의</div>
						<button class="btn" data-i18n="contact">영업팀 문의</button>
					</article>
				</div>
			</section>

			<section class="cta-section">
				<h2 data-i18n="ctaH">시작할 준비가 되셨나요?</h2>
				<p data-i18n="ctaP">이미 수많은 고객이 함께하고 있습니다.</p>
				<button class="btn" data-i18n="trial">무료로 시작하기</button>
			</section>
		</main>

		<footer>
			<p data-i18n="foot">패럴랙스 카드 데모 — 스크롤 기반 애니메이션</p>
		</footer>

		<script>
			window.I18N = {
				title: {
					ko: '패럴랙스 카드 | 실전 예제',
					en: 'Parallax Cards | Practical Examples'
				},
				en: {
					skip: 'Skip to pricing',
					back: '← Back to demos',
					h1: 'Choose Your Plan',
					lead: 'Cards move at different speeds as you scroll, creating a sense of depth.',
					pricingLabel: 'Pricing plans',

					p1H: 'Starter',
					p1P: 'Perfect for individuals and small projects.',
					p1Price: '$9/mo',
					p2H: 'Pro',
					p2P: 'Best for growing teams and businesses.',
					p2Price: '$29/mo',
					p3H: 'Enterprise',
					p3P: 'For large organisations with custom needs.',
					p3Price: 'Custom',

					popular: 'Most Popular',
					start: 'Get Started',
					contact: 'Contact Sales',

					ctaH: 'Ready to Get Started?',
					ctaP: 'Thousands of customers are already on board.',
					trial: 'Start Free Trial',

					foot: 'Parallax Cards Demo - Scroll-Driven Animation'
				}
			};
		</script>
		<script src="../scripts/i18n.js"></script>
		<script src="practical-parallax-cards.js"></script>
	</body>
</html>
