<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>폼 검증 UX 비교 | codeslog</title>
	<link rel="stylesheet" href="../assets/styles/shared.css">
	<style>
		/* ─ Layout override ─ */
		.main { max-width: 940px; }
		@media (max-width: 680px) { .two-col { grid-template-columns: 1fr; } }

		/* ─ Card header flex ─ */
		.card-hd {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		/* ─ Form fields ─ */
		.form-group { margin-bottom: 12px; }
		.field-label {
			display: block;
			font-size: 11px;
			font-weight: 600;
			color: var(--tx-2);
			text-transform: uppercase;
			letter-spacing: .05em;
			margin-bottom: 5px;
		}
		.field-input {
			width: 100%;
			padding: 7px 10px;
			background: var(--bg-2);
			border: 1px solid var(--bd);
			border-radius: var(--r);
			color: var(--tx);
			font-size: 13px;
			outline: none;
			transition: border-color .15s, box-shadow .15s;
		}
		.field-input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(85,88,227,.12);
		}
		.field-input.has-error { border-color: var(--red); }
		.field-input.has-error:focus { box-shadow: 0 0 0 3px rgba(244,63,94,.12); }
		.field-input.is-valid { border-color: var(--green); }
		.field-msg {
			font: 11px/1.3 var(--mono);
			margin-top: 3px;
			min-height: 15px;
		}
		.field-msg.err { color: var(--red); }
		.field-msg.ok  { color: var(--green); }

		/* ─ Submit button ─ */
		.btn-submit {
			width: 100%;
			margin-top: 4px;
		}

		/* ─ Submit result ─ */
		.submit-result {
			margin-top: 8px;
			padding: 7px 10px;
			border-radius: var(--r);
			font-size: 12px;
			font-weight: 600;
			min-height: 32px;
			border-left: 3px solid transparent;
		}
		.submit-result.ok  { border-left-color: var(--green); color: var(--green); background: rgba(34,197,94,.06); }
		.submit-result.err { border-left-color: var(--red);   color: var(--red);   background: rgba(244,63,94,.06); }

		/* ─ SR log section ─ */
		.sr-section {
			margin-top: 12px;
			padding-top: 12px;
			border-top: 1px solid var(--bd);
		}
		.sr-section-hd {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 6px;
		}
		.sr-title {
			font-size: 10px;
			font-weight: 600;
			color: var(--tx-2);
			text-transform: uppercase;
			letter-spacing: .06em;
		}
	</style>
</head>
<body>

<header class="hd">
	<a href="../" class="hd-back">← 데모 코드 목록보기</a>
	<div class="hd-info">
		<h1 class="hd-title">폼 검증 UX 비교</h1>
		<div class="hd-desc">포커스 즉시 오류 표시 방식과 blur 이후 검증 방식의 사용자 경험 차이를 비교합니다</div>
	</div>
</header>

<main class="main">
	<div class="two-col">

		<!-- 나쁜 UX -->
		<div class="card">
			<div class="card-hd">
				<span class="badge badge-bad">나쁜 UX</span>
				<span class="card-name">포커스 즉시 오류 표시</span>
			</div>
			<div class="card-body">
				<form id="bad-form" novalidate>
					<div class="form-group">
						<label class="field-label" for="bad-name">이름</label>
						<input type="text" id="bad-name" class="field-input" autocomplete="off" placeholder="이름 입력">
						<div class="field-msg err" id="bad-name-err"></div>
					</div>
					<div class="form-group">
						<label class="field-label" for="bad-email">이메일</label>
						<input type="text" id="bad-email" class="field-input" autocomplete="off" placeholder="이메일 입력">
						<div class="field-msg err" id="bad-email-err"></div>
					</div>
					<div class="form-group">
						<label class="field-label" for="bad-pw">비밀번호</label>
						<input type="password" id="bad-pw" class="field-input" autocomplete="off" placeholder="비밀번호 입력">
						<div class="field-msg err" id="bad-pw-err"></div>
					</div>
					<button type="submit" class="btn btn-primary btn-submit">제출</button>
					<div class="submit-result" id="bad-submit-result" aria-live="polite"></div>
				</form>
				<div class="sr-section">
					<div class="sr-section-hd">
						<span class="sr-title">스크린 리더 로그</span>
						<button class="btn btn-ghost" id="bad-reset">초기화</button>
					</div>
					<div class="sr-log" id="bad-sr-log" aria-label="나쁜 UX 스크린 리더 로그"></div>
				</div>
			</div>
		</div>

		<!-- 좋은 UX -->
		<div class="card">
			<div class="card-hd">
				<span class="badge badge-good">좋은 UX</span>
				<span class="card-name">blur 이후 검증</span>
			</div>
			<div class="card-body">
				<form id="good-form" novalidate>
					<div class="form-group">
						<label class="field-label" for="good-name">이름</label>
						<input type="text" id="good-name" class="field-input" autocomplete="off" placeholder="이름 입력" aria-describedby="good-name-err">
						<div class="field-msg err" id="good-name-err" aria-live="polite"></div>
						<div class="field-msg ok"  id="good-name-ok" aria-live="polite"></div>
					</div>
					<div class="form-group">
						<label class="field-label" for="good-email">이메일</label>
						<input type="text" id="good-email" class="field-input" autocomplete="off" placeholder="이메일 입력" aria-describedby="good-email-err">
						<div class="field-msg err" id="good-email-err" aria-live="polite"></div>
						<div class="field-msg ok"  id="good-email-ok" aria-live="polite"></div>
					</div>
					<div class="form-group">
						<label class="field-label" for="good-pw">비밀번호</label>
						<input type="password" id="good-pw" class="field-input" autocomplete="off" placeholder="비밀번호 입력" aria-describedby="good-pw-err">
						<div class="field-msg err" id="good-pw-err" aria-live="polite"></div>
						<div class="field-msg ok"  id="good-pw-ok" aria-live="polite"></div>
					</div>
					<button type="submit" class="btn btn-primary btn-submit">제출</button>
					<div class="submit-result" id="good-submit-result" aria-live="polite"></div>
				</form>
				<div class="sr-section">
					<div class="sr-section-hd">
						<span class="sr-title">스크린 리더 로그</span>
						<button class="btn btn-ghost" id="good-reset">초기화</button>
					</div>
					<div class="sr-log" id="good-sr-log" aria-label="좋은 UX 스크린 리더 로그"></div>
				</div>
			</div>
		</div>

	</div>
</main>

<script src="index.js"></script>

<footer class="site-footer">
	<a href="https://www.codeslog.com" target="_blank" rel="noopener noreferrer">codeslog.com</a>
</footer>

</body>
</html>
