<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Promise.all vs Promise.allSettled | codeslog</title>
	<link rel="stylesheet" href="../assets/styles/shared.css">
	<style>
		/* ─ Config section ─ */
		.config {
			background: var(--surface);
			border: 1px solid var(--bd);
			border-radius: var(--r);
			padding: 16px;
			margin-bottom: 14px;
		}
		.config-title {
			font-size: 11px;
			font-weight: 600;
			color: var(--tx-2);
			letter-spacing: .05em;
			text-transform: uppercase;
			margin-bottom: 12px;
		}
		.api-row {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			margin-bottom: 14px;
		}
		.api-item { display: flex; flex-direction: column; gap: 5px; }
		.api-label {
			font-size: 11px;
			font-weight: 600;
			color: var(--tx-2);
			letter-spacing: .04em;
			text-transform: uppercase;
		}
		.api-select {
			padding: 6px 10px;
			background: var(--bg-2);
			border: 1px solid var(--bd);
			border-radius: var(--r);
			color: var(--tx);
			font-size: 12px;
			cursor: pointer;
			outline: none;
			min-width: 80px;
			transition: border-color .15s;
		}
		.api-select:focus { border-color: var(--accent); }
		.api-select.fail  { border-color: var(--red); color: var(--red); }

		/* ─ Card body min-height ─ */
		.card-body { min-height: 200px; }
	</style>
</head>
<body>

<header class="hd">
	<a href="https://codeslog.com/ko/posts/javascript-promise-methods/" class="hd-back">← 포스트로 돌아가기</a>
	<div class="hd-info">
		<div class="hd-title">Promise.all vs Promise.allSettled</div>
		<div class="hd-desc">API 성공/실패 조합에 따른 두 메서드의 동작 차이를 확인합니다</div>
	</div>
</header>

<main class="main">

	<div class="config">
		<div class="config-title">시뮬레이션 설정</div>
		<div class="api-row">
			<div class="api-item">
				<span class="api-label">API 1</span>
				<select id="api1" class="api-select">
					<option value="ok">성공</option>
					<option value="fail">실패</option>
				</select>
			</div>
			<div class="api-item">
				<span class="api-label">API 2</span>
				<select id="api2" class="api-select">
					<option value="ok">성공</option>
					<option value="fail" selected>실패</option>
				</select>
			</div>
			<div class="api-item">
				<span class="api-label">API 3</span>
				<select id="api3" class="api-select">
					<option value="ok">성공</option>
					<option value="fail">실패</option>
				</select>
			</div>
		</div>
		<div class="btn-row">
			<button class="btn btn-primary" id="run-both">두 메서드 동시 실행</button>
			<button class="btn btn-sub" id="run-all">Promise.all만</button>
			<button class="btn btn-sub" id="run-settled">Promise.allSettled만</button>
			<button class="btn btn-ghost" id="reset-btn">초기화</button>
		</div>
	</div>

	<div class="two-col">
		<div class="card">
			<div class="card-hd">
				<div class="card-name">Promise.all</div>
				<div class="card-sub">하나라도 실패하면 전체 중단</div>
			</div>
			<div class="card-body" id="all-panel" aria-live="polite">
				<div class="log-empty">실행 버튼을 누르면 결과가 표시됩니다</div>
			</div>
		</div>
		<div class="card">
			<div class="card-hd">
				<div class="card-name">Promise.allSettled</div>
				<div class="card-sub">모두 완료 후 개별 결과 반환</div>
			</div>
			<div class="card-body" id="settled-panel" aria-live="polite">
				<div class="log-empty">실행 버튼을 누르면 결과가 표시됩니다</div>
			</div>
		</div>
	</div>

</main>

<script>
	const selects = [
		document.getElementById('api1'),
		document.getElementById('api2'),
		document.getElementById('api3'),
	];

	selects.forEach(s => s.addEventListener('change', () => {
		s.classList.toggle('fail', s.value === 'fail');
	}));
	selects.forEach(s => s.classList.toggle('fail', s.value === 'fail'));

	const allPanel     = document.getElementById('all-panel');
	const settledPanel = document.getElementById('settled-panel');
	const allBtns = [
		document.getElementById('run-both'),
		document.getElementById('run-all'),
		document.getElementById('run-settled'),
	];

	function configs() {
		return selects.map(s => s.value === 'fail');
	}

	function fakeApi(id, fail) {
		const delay = 400 + Math.random() * 800;
		const t0 = Date.now();
		return new Promise((resolve, reject) => {
			setTimeout(() => {
				const ms = Date.now() - t0;
				if (fail) reject({ id, msg: `API ${id} 오류`, ms });
				else resolve({ id, data: `데이터 ${String.fromCharCode(64 + id)}`, ms });
			}, delay);
		});
	}

	function mkList(panel) {
		panel.innerHTML = '';
		const list = document.createElement('div');
		list.className = 'log-list';
		panel.appendChild(list);
		return list;
	}

	function addRow(list, cls, text) {
		const el = document.createElement('div');
		el.className = 'log-row ' + cls;
		el.textContent = text;
		list.appendChild(el);
		return el;
	}

	function lock()   { allBtns.forEach(b => b.disabled = true); }
	function unlock() { allBtns.forEach(b => b.disabled = false); }

	async function runAll(panel) {
		const list = mkList(panel);
		const cfg  = configs();
		const rows = cfg.map((_, i) => addRow(list, 'pending', `API ${i + 1} — 요청 중`));

		const promises = cfg.map((fail, i) =>
			fakeApi(i + 1, fail)
				.then(r => {
					rows[i].className   = 'log-row ok';
					rows[i].textContent = `API ${r.id} — "${r.data}" (${r.ms}ms)`;
					return r;
				})
				.catch(e => {
					rows[i].className   = 'log-row err';
					rows[i].textContent = `API ${e.id} — ${e.msg} (${e.ms}ms)`;
					throw e;
				})
		);

		try {
			await Promise.all(promises);
			addRow(list, 'done-ok', '전체 성공 — 모든 결과 사용 가능');
		} catch (err) {
			rows.forEach(r => {
				if (r.className.includes('pending')) {
					r.className   = 'log-row err';
					r.textContent = r.textContent.replace('요청 중', '취소됨');
				}
			});
			addRow(list, 'done-err', `전체 실패 — "${err.msg}"`);
		}
	}

	async function runSettled(panel) {
		const list = mkList(panel);
		const cfg  = configs();
		const rows = cfg.map((_, i) => addRow(list, 'pending', `API ${i + 1} — 요청 중`));

		const results = await Promise.allSettled(cfg.map((fail, i) => fakeApi(i + 1, fail)));

		results.forEach((r, i) => {
			if (r.status === 'fulfilled') {
				const v = r.value;
				rows[i].className   = 'log-row ok';
				rows[i].textContent = `API ${v.id} — "${v.data}" (${v.ms}ms)`;
			} else {
				const e = r.reason;
				rows[i].className   = 'log-row err';
				rows[i].textContent = `API ${e.id} — ${e.msg} (${e.ms}ms)`;
			}
		});

		const n = results.filter(r => r.status === 'fulfilled').length;
		addRow(list, 'done-ok', `${n} / 3 성공 — 부분 성공도 처리 가능`);
	}

	document.getElementById('run-both').addEventListener('click', async () => {
		lock();
		await Promise.all([runAll(allPanel), runSettled(settledPanel)]);
		unlock();
	});

	document.getElementById('run-all').addEventListener('click', async () => {
		lock(); await runAll(allPanel); unlock();
	});

	document.getElementById('run-settled').addEventListener('click', async () => {
		lock(); await runSettled(settledPanel); unlock();
	});

	document.getElementById('reset-btn').addEventListener('click', () => {
		allPanel.innerHTML     = '<div class="log-empty">실행 버튼을 누르면 결과가 표시됩니다</div>';
		settledPanel.innerHTML = '<div class="log-empty">실행 버튼을 누르면 결과가 표시됩니다</div>';
	});
</script>

</body>
</html>
