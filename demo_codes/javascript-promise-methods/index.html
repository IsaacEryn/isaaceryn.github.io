<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Promise.all vs Promise.allSettled | codeslog</title>
	<link rel="stylesheet" href="../assets/styles/shared.css">
	<style>
		/* ─ Config section ─ */
		.config {
			background: var(--surface);
			border: 1px solid var(--bd);
			border-radius: var(--r);
			padding: 16px;
			margin-bottom: 14px;
		}
		.config-title {
			font-size: 11px;
			font-weight: 600;
			color: var(--tx-2);
			letter-spacing: .05em;
			text-transform: uppercase;
			margin-bottom: 12px;
		}
		.api-row {
			display: flex;
			gap: 10px;
			flex-wrap: wrap;
			margin-bottom: 14px;
		}
		.api-item { display: flex; flex-direction: column; gap: 5px; }
		.api-label {
			font-size: 11px;
			font-weight: 600;
			color: var(--tx-2);
			letter-spacing: .04em;
			text-transform: uppercase;
		}
		.api-select {
			padding: 6px 10px;
			background: var(--bg-2);
			border: 1px solid var(--bd);
			border-radius: var(--r);
			color: var(--tx);
			font-size: 12px;
			cursor: pointer;
			outline: none;
			min-width: 80px;
			transition: border-color .15s;
		}
		.api-select:focus { border-color: var(--accent); }
		.api-select.fail  { border-color: var(--red); color: var(--red); }

		/* ─ Card body min-height ─ */
		.card-body { min-height: 200px; }
	</style>
</head>
<body>

<header class="hd">
	<a href="../" class="hd-back">← 데모 코드 목록보기</a>
	<div class="hd-info">
		<h1 class="hd-title">Promise.all vs Promise.allSettled</h1>
		<div class="hd-desc">API 성공/실패 조합에 따른 두 메서드의 동작 차이를 확인합니다</div>
		<a href="https://www.codeslog.com/posts/javascript-promise-methods/" class="hd-post-link" target="_blank" rel="noopener noreferrer">관련 포스트 읽기 →</a>
	</div>
</header>

<main class="main">

	<div class="config">
		<div class="config-title">시뮬레이션 설정</div>
		<div class="api-row">
			<div class="api-item">
				<label class="api-label" for="api1">API 1</label>
				<select id="api1" class="api-select">
					<option value="ok">성공</option>
					<option value="fail">실패</option>
				</select>
			</div>
			<div class="api-item">
				<label class="api-label" for="api2">API 2</label>
				<select id="api2" class="api-select">
					<option value="ok">성공</option>
					<option value="fail" selected>실패</option>
				</select>
			</div>
			<div class="api-item">
				<label class="api-label" for="api3">API 3</label>
				<select id="api3" class="api-select">
					<option value="ok">성공</option>
					<option value="fail">실패</option>
				</select>
			</div>
		</div>
		<div class="btn-row">
			<button class="btn btn-primary" id="run-both">두 메서드 동시 실행</button>
			<button class="btn btn-sub" id="run-all">Promise.all만</button>
			<button class="btn btn-sub" id="run-settled">Promise.allSettled만</button>
			<button class="btn btn-ghost" id="reset-btn">초기화</button>
		</div>
	</div>

	<div class="two-col">
		<div class="card">
			<div class="card-hd">
				<div class="card-name">Promise.all</div>
				<div class="card-sub">하나라도 실패하면 전체 중단</div>
			</div>
			<div class="card-body" id="all-panel" aria-live="polite">
				<div class="log-empty">실행 버튼을 누르면 결과가 표시됩니다</div>
			</div>
		</div>
		<div class="card">
			<div class="card-hd">
				<div class="card-name">Promise.allSettled</div>
				<div class="card-sub">모두 완료 후 개별 결과 반환</div>
			</div>
			<div class="card-body" id="settled-panel" aria-live="polite">
				<div class="log-empty">실행 버튼을 누르면 결과가 표시됩니다</div>
			</div>
		</div>
	</div>

</main>

<script src="index.js"></script>

<footer class="site-footer">
	<a href="https://www.codeslog.com" target="_blank" rel="noopener noreferrer">codeslog.com</a>
</footer>

</body>
</html>
